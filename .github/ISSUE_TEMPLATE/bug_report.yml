name: Bug report
description: Something in Jabbersnap for Windows or the remote does not work the way it should.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Issues here are public. Please leave out personal data. Review logs and
        screenshots before attaching. Never post API keys.

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
      placeholder: |
        1. Pressed button 1 and talked
        2. Pressed it again to stop
        3. Expected the text to be pasted; nothing appeared and the recording indicator reported a transcription failure
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Where does this happen?
      options:
        - Connecting or pairing the remote
        - Recording or transcription
        - Pasting or a button shortcut
        - The firmware update
        - Installing or updating the app
        - Settings, History or transforms
        - Not sure
    validations:
      required: true

  - type: input
    id: app-version
    attributes:
      label: Jabbersnap version
      description: Find it under System › About, or use the installer file name.
      placeholder: "0.8.16"
    validations:
      required: true

  - type: input
    id: windows-version
    attributes:
      label: Windows version
      description: Settings › System › About, under Windows specifications.
      placeholder: "Windows 11 24H2"
    validations:
      required: true

  - type: input
    id: adapter
    attributes:
      label: Bluetooth adapter
      description: If the problem involves a remote, name the adapter from Windows Device Manager if known.
    validations:
      required: false

  - type: textarea
    id: frequency
    attributes:
      label: How often does it happen?
      description: Every time, sometimes, or only once? Anything that makes it more likely?
    validations:
      required: false

  - type: textarea
    id: log
    attributes:
      label: Log file and anything else
      description: Open System › Help › View logs and attach Jabbersnap.log here, plus screenshots if helpful. Review files before posting.
    validations:
      required: false
