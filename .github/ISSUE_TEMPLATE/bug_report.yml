name: Bug report
description: Something in Jabbersnap Lite or the remote does not work the way it should.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Issues here are public. Please leave out personal data. The log file
        holds the first line of each transcript; check it before attaching.

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
      placeholder: |
        1. Pressed button 1 and talked
        2. Pressed it again to stop
        3. Expected the text to be pasted; nothing appeared and the window said "Transcription failed"
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Where does this happen?
      options:
        - Connecting or pairing the remote
        - Recording or transcription
        - Pasting or a button shortcut
        - The firmware update
        - Not sure
    validations:
      required: true

  - type: input
    id: lite-version
    attributes:
      label: Jabbersnap Lite version
      description: The first line the program prints, or the version in the file name you downloaded.
      placeholder: "0.1.0"
    validations:
      required: true

  - type: input
    id: windows-version
    attributes:
      label: Windows version
      description: Settings › System › About, under Windows specifications.
      placeholder: "Windows 11 24H2"
    validations:
      required: true

  - type: input
    id: adapter
    attributes:
      label: Bluetooth adapter
      description: The one the program names when it starts (for example "TP-Link UB500, Bluetooth 5.3").
    validations:
      required: false

  - type: textarea
    id: frequency
    attributes:
      label: How often does it happen?
      description: Every time, sometimes, or only once? Anything that makes it more likely?
    validations:
      required: false

  - type: textarea
    id: log
    attributes:
      label: Log file and anything else
      description: Drag `jabbersnap-lite.log` from the program's folder in here, plus screenshots if they help.
    validations:
      required: false
